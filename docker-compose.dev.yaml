services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    restart: always
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - api

  api:
    build:
      dockerfile: Dockerfile.dev
      context: ./backend
    env_file:
      - .env
    volumes:
      - /app/node_modules
      - ./backend:/app
    depends_on:
      - redis

  frontend:
    build:
      dockerfile: Dockerfile.dev
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    environment:
      - BASE_URL=${BASE_URL}
